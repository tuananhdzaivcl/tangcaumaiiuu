<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Tai Xiu Engine - V6</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050814;
            --panel-bg: rgba(10, 16, 30, 0.7);
            --neon-cyan: #00f0ff;
            --neon-purple: #b500ff;
            --neon-red: #ff0055;
            --neon-green: #00ff66;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border-glow: rgba(0, 240, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* --- MÀN HÌNH KHÓA --- */
        #lock-screen {
            width: 100%; max-width: 420px; background: var(--panel-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow); box-shadow: 0 0 40px rgba(0, 240, 255, 0.1); border-radius: 16px; padding: 40px 30px;
            text-align: center; display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 10;
        }
        .lock-icon { font-size: 50px; color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); margin-bottom: 10px; }
        .lock-title { font-size: 24px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .lock-desc { font-family: 'Fira Code', monospace; font-size: 12px; color: var(--text-muted); }
        
        .key-input {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.6); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 8px;
            color: var(--neon-cyan); font-family: 'Fira Code', monospace; font-size: 12px; text-align: center; letter-spacing: 1px;
            outline: none; transition: 0.3s;
        }
        .key-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        .btn-auth {
            width: 100%; padding: 15px; background: transparent; border: 1px solid var(--neon-cyan); border-radius: 8px;
            color: var(--neon-cyan); font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.3s; text-transform: uppercase;
            position: relative; overflow: hidden;
        }
        .btn-auth:hover { background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }
        .error-msg { color: var(--neon-red); font-size: 12px; font-family: 'Fira Code', monospace; display: none; }

        /* --- GIAO DIỆN CHÍNH --- */
        #app-container { display: none; width: 100%; max-width: 1200px; flex-direction: column; gap: 15px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--panel-bg); border: 1px solid var(--border-glow); border-radius: 12px; backdrop-filter: blur(10px); }
        .logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,240,255,0.5); display: flex; align-items: center; gap: 10px; }
        .btn-logout { background: transparent; border: 1px solid var(--neon-red); color: var(--neon-red); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-logout:hover { background: rgba(255, 0, 85, 0.2); box-shadow: 0 0 10px var(--neon-red); }

        .dashboard { display: grid; grid-template-columns: 300px 1fr 300px; gap: 15px; }
        
        .panel { 
            background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05); border-top: 2px solid var(--neon-cyan);
            border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel-title { font-size: 12px; font-family: 'Fira Code', monospace; color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; display: flex; justify-content: space-between; }

        /* CỘT 1: ĐIỀU KHIỂN */
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px 0; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; border: 1px solid transparent; font-size: 16px; text-transform: uppercase; }
        .btn-tai { background: rgba(255, 0, 85, 0.1); color: var(--neon-red); border-color: var(--neon-red); }
        .btn-tai:active { background: var(--neon-red); color: #fff; box-shadow: 0 0 20px var(--neon-red); }
        .btn-xiu { background: rgba(0, 240, 255, 0.1); color: var(--neon-cyan); border-color: var(--neon-cyan); }
        .btn-xiu:active { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }
        
        .btn-utility { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; cursor: pointer; flex: 1; font-size: 12px; transition: 0.2s; font-family: 'Fira Code', monospace; }
        .btn-utility:hover { background: rgba(255,255,255,0.1); }

        .history-container { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; height: 140px; overflow-y: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
        .chip { width: 28px; height: 28px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 13px; font-family: 'Fira Code', monospace; }
        .chip.T { background: rgba(255, 0, 85, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }
        .chip.X { background: rgba(0, 240, 255, 0.2); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: 900; font-family: 'Fira Code', monospace; }

        /* CỘT 2: TRUNG TÂM AI */
        .ai-center { display: flex; flex-direction: column; align-items: center; justify-content: center; border-top-color: var(--neon-purple); position: relative; overflow: hidden; }
        .radar-bg { position: absolute; width: 200%; height: 200%; background: conic-gradient(from 0deg, transparent 0%, rgba(181, 0, 255, 0.1) 20%, transparent 25%); animation: rotateRadar 4s linear infinite; pointer-events: none; }
        @keyframes rotateRadar { 100% { transform: rotate(360deg); } }
        
        .pred-result { font-size: 80px; font-weight: 900; line-height: 1; text-transform: uppercase; position: relative; z-index: 1; transition: 0.3s; }
        .pred-result.T { color: var(--neon-red); text-shadow: 0 0 30px var(--neon-red); }
        .pred-result.X { color: var(--neon-cyan); text-shadow: 0 0 30px var(--neon-cyan); }
        .pred-result.WAIT { color: var(--text-muted); font-size: 50px; text-shadow: none; }

        .confidence-wrapper { width: 100%; margin-top: 30px; z-index: 1; }
        .confidence-text { font-family: 'Fira Code', monospace; font-size: 13px; text-align: center; margin-bottom: 8px; color: var(--neon-purple); }
        .confidence-bar-bg { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; width: 80%; margin: 0 auto; }
        .confidence-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); transition: width 0.5s; box-shadow: 0 0 10px var(--neon-purple); }

        /* CỘT 3: TRẠNG THÁI & LOG */
        .algo-list { display: flex; flex-direction: column; gap: 8px; }
        .algo-item { display: flex; justify-content: space-between; font-family: 'Fira Code', monospace; font-size: 11px; padding: 5px; border-left: 2px solid #333; background: rgba(0,0,0,0.3); }
        .algo-item.active { border-left-color: var(--neon-green); color: var(--neon-green); }
        .algo-item.T { border-left-color: var(--neon-red); }
        .algo-item.X { border-left-color: var(--neon-cyan); }

        .console-panel { background: #020308; border-radius: 8px; padding: 10px; height: 150px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 10px; color: #888; border: 1px solid rgba(255,255,255,0.05); }
        .log-line { margin-bottom: 3px; }
        .log-time { color: #444; margin-right: 5px; }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .pred-result { font-size: 60px; }
        }
    </style>
</head>
<body>

    <!-- LOCK SCREEN -->
    <div id="lock-screen">
        <div class="lock-icon">⚡</div>
        <div class="lock-title">QUANTUM AI V6</div>
        <div class="lock-desc">HỆ THỐNG YÊU CẦU MÃ HÓA NHỊ PHÂN ĐỂ TRUY CẬP</div>
        <input type="text" id="keyInput" class="key-input" placeholder="Nhập chuỗi 0 và 1..." autocomplete="off">
        <div id="errorMsg" class="error-msg">ACCESS DENIED: INVALID BINARY SEQUENCE</div>
        <button class="btn-auth" id="btnAuth">Khởi Tạo</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="app-container">
        <div class="header">
            <div class="logo">⚡ QUANTUM ENGINE</div>
            <button class="btn-logout" id="btnLogout">ĐĂNG XUẤT</button>
        </div>

        <div class="dashboard">
            <!-- CỘT 1: ĐIỀU KHIỂN & LỊCH SỬ -->
            <div class="panel">
                <div class="panel-title">INPUT DATA</div>
                <div class="btn-group">
                    <button class="btn btn-tai" id="btnTai">TÀI</button>
                    <button class="btn btn-xiu" id="btnXiu">XỈU</button>
                </div>
                <div class="btn-group">
                    <button class="btn-utility" id="btnRandom">RANDOM</button>
                    <button class="btn-utility" id="btnClear">RESET</button>
                </div>
                
                <div class="panel-title" style="margin-top: 10px;">SEQUENCE HISTORY</div>
                <div class="history-container" id="historyContainer"></div>

                <div class="stats-grid" style="margin-top: 10px;">
                    <div class="stat-box"><div class="stat-label">WIN</div><div class="stat-val" id="statWin" style="color: var(--neon-green);">0</div></div>
                    <div class="stat-box"><div class="stat-label">LOSS</div><div class="stat-val" id="statLoss" style="color: var(--neon-red);">0</div></div>
                    <div class="stat-box" style="grid-column: span 2;"><div class="stat-label">RATE</div><div class="stat-val" id="statRate" style="color: var(--neon-purple);">0%</div></div>
                </div>
            </div>

            <!-- CỘT 2: TRUNG TÂM DỰ ĐOÁN -->
            <div class="panel ai-center">
                <div class="radar-bg"></div>
                <div class="panel-title" style="width: 100%;">QUANTUM PREDICTION</div>
                <div class="pred-result WAIT" id="predResult">STANDBY</div>
                <div class="confidence-wrapper">
                    <div class="confidence-text" id="confText">PROBABILITY: 0%</div>
                    <div class="confidence-bar-bg">
                        <div class="confidence-bar-fill" id="confBar"></div>
                    </div>
                </div>
            </div>

            <!-- CỘT 3: THUẬT TOÁN & LOG -->
            <div class="panel" style="border-top-color: var(--neon-green);">
                <div class="panel-title">NEURAL ALGORITHMS</div>
                <div class="algo-list" id="algoList">
                    <!-- Dynamic list -->
                </div>
                <div class="panel-title" style="margin-top: 10px;">SYSTEM LOG</div>
                <div class="console-panel" id="console"></div>
            </div>
        </div>
    </div>

<script>
(function() {
    'use strict';

    // ==========================================
    // KEY NHỊ PHÂN (ADMINTUANANH)
    // ==========================================
    const VALID_KEY = "010000010100010001001101010010010100111001010100010101010100000101001110010000010100111001001000";
    const lockScreen = document.getElementById('lock-screen');
    const appContainer = document.getElementById('app-container');

    function checkLogin() {
        if (localStorage.getItem('quantum_v6_key') === VALID_KEY) {
            lockScreen.style.display = 'none';
            appContainer.style.display = 'flex';
            initQuantumApp();
        } else {
            lockScreen.style.display = 'flex';
            appContainer.style.display = 'none';
        }
    }

    document.getElementById('btnAuth').addEventListener('click', () => {
        let input = document.getElementById('keyInput').value.trim();
        if (input === VALID_KEY) {
            localStorage.setItem('quantum_v6_key', VALID_KEY);
            checkLogin();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
        localStorage.removeItem('quantum_v6_key');
        location.reload();
    });

    // ==========================================
    // QUANTUM AI ENGINE LOGIC
    // ==========================================
    let isAppInit = false;

    function initQuantumApp() {
        if (isAppInit) return;
        isAppInit = true;

        let history = []; 
        let totalWins = 0, totalLosses = 0;
        let lastPrediction = null;
        let isWaitingForResult = false;

        const dom = {
            history: document.getElementById('historyContainer'),
            predResult: document.getElementById('predResult'),
            confText: document.getElementById('confText'),
            confBar: document.getElementById('confBar'),
            algoList: document.getElementById('algoList'),
            console: document.getElementById('console'),
            win: document.getElementById('statWin'),
            loss: document.getElementById('statLoss'),
            rate: document.getElementById('statRate')
        };

        function log(msg, color = "#888") {
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span class="log-time">[${time}]</span> <span style="color:${color}">${msg}</span>`;
            dom.console.appendChild(line);
            dom.console.scrollTop = dom.console.scrollHeight;
        }

        function getVal(idx) {
            return (idx < 1 || idx > history.length) ? null : history[history.length - idx];
        }

        // --- 12 THUẬT TOÁN LƯỢNG TỬ ---
        
        // 1. Bayes Theorem
        function algoBayes() {
            if (history.length < 6) return null;
            let tToT = 0, tToX = 0, xToT = 0, xToX = 0;
            for(let i=0; i<history.length-1; i++) {
                if(history[i]==='T' && history[i+1]==='T') tToT++;
                if(history[i]==='T' && history[i+1]==='X') tToX++;
                if(history[i]==='X' && history[i+1]==='T') xToT++;
                if(history[i]==='X' && history[i+1]==='X') xToX++;
            }
            let last = getVal(1);
            if(last === 'T' && tToT > tToX) return { vote: 'T', name: "Bayes_Inference", w: 2 };
            if(last === 'X' && xToX > xToT) return { vote: 'X', name: "Bayes_Inference", w: 2 };
            return null;
        }

        // 2. Chaos Theory (Điểm bùng nổ)
        function algoChaos() {
            if (history.length < 8) return null;
            let maxStreak = 0, currentStreak = 1;
            for(let i=1; i<history.length; i++) {
                if(history[i] === history[i-1]) currentStreak++;
                else { if(currentStreak > maxStreak) maxStreak = currentStreak; currentStreak = 1; }
            }
            if (maxStreak >= 5) return { vote: 'T', name: "Chaos_Attractor", w: 3 }; // Bẻ cầu mạnh
            return null;
        }

        // 3. Game Theory (Bẫy nhà cái)
        function algoGameTheory() {
            if (history.length < 10) return null;
            let tCount = history.slice(-10).filter(x=>x==='T').length;
            if(tCount === 7 || tCount === 3) return { vote: tCount === 7 ? 'X' : 'T', name: "Nash_Equilibrium", w: 2.5 };
            return null;
        }

        // 4. Quantum Superposition
        function algoQuantum() {
            if (history.length < 4) return null;
            let last4 = getVal(1)+getVal(2)+getVal(3)+getVal(4);
            if(last4 === 'TXTX' || last4 === 'XTXT') return { vote: getVal(1)==='T'?'X':'T', name: "Superposition", w: 2 };
            return null;
        }

        // 5. Fractal Dimension
        function algoFractal() {
            if (history.length < 7) return null;
            let pattern = getVal(1)+getVal(2)+getVal(3);
            for(let i=4; i<=history.length-3; i++) {
                let past = history[history.length-i]+history[history.length-i-1]+history[history.length-i-2];
                if(pattern === past) {
                    let next = history[history.length-i+1];
                    if(next) return { vote: next, name: "Fractal_Match", w: 2.5 };
                }
            }
            return null;
        }

        // 6. Fourier Transform (Tần số)
        function algoFourier() {
            if (history.length < 12) return null;
            let oscillate = 0;
            for(let i=1; i<12; i++) if(getVal(i) !== getVal(i+1)) oscillate++;
            if (oscillate >= 9) return { vote: getVal(1)==='T'?'X':'T', name: "Fourier_Wave", w: 2 };
            return null;
        }

        // 7. Genetic Algorithm (Mẫu tốt nhất)
        function algoGenetic() {
            if (history.length < 5) return null;
            // Nếu 3 phiên giống nhau, gen trội thắng
            if(getVal(1)===getVal(2) && getVal(2)===getVal(3)) return { vote: getVal(1)==='T'?'X':'T', name: "Genetic_Mutate", w: 2 };
            return null;
        }

        // 8. K-Nearest Neighbors (Hàng xóm gần nhất)
        function algoKNN() {
            if (history.length < 10) return null;
            let tCount = history.slice(-5).filter(x=>x==='T').length;
            if(tCount >= 4) return { vote: 'X', name: "KNN_Cluster", w: 1.5 };
            if(tCount <= 1) return { vote: 'T', name: "KNN_Cluster", w: 1.5 };
            return null;
        }

        // 9. Reinforcement Learning (Học từ sai lầm)
        function algoRL() {
            if (totalWins + totalLosses < 3) return null;
            // Nếu thua 2 ván liên tiếp, đổi chiến thuật
            if(lastPrediction && totalLosses >= 2) return { vote: lastPrediction==='T'?'X':'T', name: "RL_Adaptation", w: 2 };
            return null;
        }

        // 10. Entropy Shield
        function algoEntropy() {
            if (history.length < 6) return null;
            let changes = 0;
            for(let i=1; i<6; i++) if(getVal(i)!==getVal(i+1)) changes++;
            if(changes === 5) return { vote: getVal(1), name: "Entropy_Lock", w: 1.5 };
            return null;
        }

        // 11. Monte Carlo Method
        function algoMonteCarlo() {
            if (history.length < 15) return null;
            let tCount = history.slice(-15).filter(x=>x==='T').length;
            if(tCount >= 11) return { vote: 'X', name: "Monte_Carlo_Sim", w: 2 };
            if(tCount <= 4) return { vote: 'T', name: "Monte_Carlo_Sim", w: 2 };
            return null;
        }

        // 12. Fibonacci Golden Ratio
        function algoFibo() {
            if (history.length < 8) return null;
            let streak = 1;
            for(let i=1; i<history.length; i++) {
                if(getVal(i) === getVal(i+1)) streak++; else break;
            }
            if(streak === 3 || streak === 5) return { vote: getVal(1)==='T'?'X':'T', name: "Golden_Ratio", w: 1.5 };
            return null;
        }

        // --- HÀM TỔNG HỢP ---
        function analyze() {
            if (history.length < 3) {
                dom.predResult.innerText = 'STANDBY';
                dom.predResult.className = 'pred-result WAIT';
                dom.confText.innerText = `PROBABILITY: 0%`;
                dom.confBar.style.width = '0%';
                dom.algoList.innerHTML = '';
                lastPrediction = null;
                return;
            }

            const algos = [
                algoBayes(), algoChaos(), algoGameTheory(), algoQuantum(), 
                algoFractal(), algoFourier(), algoGenetic(), algoKNN(), 
                algoRL(), algoEntropy(), algoMonteCarlo(), algoFibo()
            ].filter(a => a !== null);

            let voteT = 0, voteX = 0;
            let activeListHTML = '';

            algos.forEach(a => {
                if (a.vote === 'T') voteT += a.w;
                if (a.vote === 'X') voteX += a.w;
                let colorClass = a.vote === 'T' ? 'T' : 'X';
                activeListHTML += `<div class="algo-item ${colorClass}"><span>${a.name}</span><span>${a.vote}</span></div>`;
            });

            dom.algoList.innerHTML = activeListHTML || '<div style="color:#555;font-size:10px;text-align:center;">Đang quét tín hiệu...</div>';

            const totalW = voteT + voteX;
            let finalPred = 'WAIT', conf = 50;
            
            if (totalW > 0) {
                if (voteT > voteX) { finalPred = 'T'; conf = (voteT / totalW) * 100; }
                else if (voteX > voteT) { finalPred = 'X'; conf = (voteX / totalW) * 100; }
                else { finalPred = Math.random() > 0.5 ? 'T' : 'X'; conf = 50; }
            } else {
                finalPred = Math.random() > 0.5 ? 'T' : 'X';
                conf = 50;
            }

            conf = Math.round(conf);
            let noise = Math.floor(Math.random() * 7) - 3;
            conf += noise;

            // Giới hạn max 62% (Thực tế)
            if (conf > 62) conf = 62;
            if (conf < 35) conf = 35;

            dom.predResult.innerText = finalPred === 'T' ? 'TÀI' : 'XỈU';
            dom.predResult.className = `pred-result ${finalPred}`;
            dom.confText.innerText = `PROBABILITY: ${conf}%`;
            dom.confBar.style.width = `${(conf / 62) * 100}%`;

            lastPrediction = finalPred;
            isWaitingForResult = true;
        }

        // --- ĐIỀU KHIỂN UI ---
        function addResult(res) {
            if (isWaitingForResult && lastPrediction) {
                if (lastPrediction === res) {
                    totalWins++;
                    log(`KẾT QUẢ: ${res} -> THẮNG! (Dự đoán: ${lastPrediction})`, "var(--neon-green)");
                } else {
                    totalLosses++;
                    log(`KẾT QUẢ: ${res} -> THUA! (Dự đoán: ${lastPrediction})`, "var(--neon-red)");
                }
                isWaitingForResult = false;
            } else {
                log(`INPUT: Đã nạp ${res} vào hệ thống.`, "#fff");
            }

            history.push(res);
            if (history.length > 50) history.shift();
            
            // Render History
            dom.history.innerHTML = '';
            history.slice(-20).forEach(r => {
                const chip = document.createElement('div');
                chip.className = `chip ${r}`;
                chip.innerText = r;
                dom.history.appendChild(chip);
            });
            dom.history.scrollLeft = dom.history.scrollWidth;

            // Render Stats
            dom.win.innerText = totalWins;
            dom.loss.innerText = totalLosses;
            let total = totalWins + totalLosses;
            dom.rate.innerText = total === 0 ? '0%' : `${Math.round((totalWins/total)*100)}%`;

            analyze();
        }

        document.getElementById('btnTai').addEventListener('click', () => addResult('T'));
        document.getElementById('btnXiu').addEventListener('click', () => addResult('X'));
        document.getElementById('btnRandom').addEventListener('click', () => addResult(Math.random() > 0.5 ? 'T' : 'X'));
        document.getElementById('btnClear').addEventListener('click', () => {
            history = []; totalWins = 0; totalLosses = 0; lastPrediction = null; isWaitingForResult = false;
            dom.win.innerText = 0; dom.loss.innerText = 0; dom.rate.innerText = '0%';
            dom.history.innerHTML = ''; dom.console.innerHTML = '';
            log("HỆ THỐNG ĐÃ RESET.", "var(--neon-purple)");
            analyze();
        });

        log("QUANTUM AI V6 KHỞI ĐỘNG THÀNH CÔNG.", "var(--neon-cyan)");
        analyze();
    }

    checkLogin();
})();
</script>
</body>
</html>
